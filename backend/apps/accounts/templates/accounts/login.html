{% extends "auth_base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md rounded-lg border bg-white p-6">
    <h1 class="text-2xl font-semibold">Login</h1>
    <p class="mt-1 text-sm text-gray-600">Sign in to continue.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="w-full rounded-md bg-black px-4 py-2 text-sm font-medium text-white" type="submit">Login</button>
    </form>

    <div class="mt-4 space-y-2 text-sm">
      <p><a class="font-medium text-gray-800 hover:underline" href="{% url 'accounts:password_reset' %}">Forgot password?</a></p>
      <p class="text-gray-600">Don’t have an account? <a class="font-medium text-gray-800 hover:underline" href="{% url 'accounts:signup' %}">Create account</a></p>
    </div>
  </div>
{% endblock %}
