{% extends "auth_base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md rounded-lg border bg-white p-6">
    <h1 class="text-2xl font-semibold">Reset your password</h1>
    <p class="mt-1 text-sm text-gray-600">Enter your email address and we’ll send you a link to reset your password.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <button
        type="submit"
        class="w-full rounded-md bg-black px-4 py-2 text-sm font-medium text-white hover:bg-gray-800"
      >
        Send reset link
      </button>
    </form>

    <p class="mt-4 text-sm">
      <a class="font-medium text-gray-900 hover:underline" href="{% url 'accounts:login' %}">
        Back to login
      </a>
    </p>
  </div>
{% endblock %}
