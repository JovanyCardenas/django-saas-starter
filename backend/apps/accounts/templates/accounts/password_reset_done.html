{% extends "auth_base.html" %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md rounded-lg border bg-white p-6">
    <h1 class="text-2xl font-semibold">Check your email</h1>
    <p class="mt-2 text-sm text-gray-600">
      If an account exists with that email address, a password reset link has been sent.
    </p>

    <p class="mt-4 text-sm">
      <a class="font-medium text-gray-900 hover:underline" href="{% url 'accounts:login' %}">
        Back to login
      </a>
    </p>
  </div>
{% endblock %}
