{% extends "auth_base.html" %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-xl rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
    <div class="text-center">
      <h1 class="text-2xl font-semibold text-gray-900">Check your email</h1>

      <p class="mt-3 text-sm leading-6 text-gray-600">
        If an account exists with that email address, a password reset link has been sent.
      </p>
    </div>

    <div class="mt-6">
      <a
        href="{% url 'accounts:login' %}"
        class="block w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-center text-sm font-medium text-gray-900 hover:bg-gray-50"
      >
        Back to login
      </a>
    </div>
  </div>
{% endblock %}
