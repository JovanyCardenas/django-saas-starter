{% extends "auth_base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md rounded-lg border bg-white p-6">
    <h1 class="text-2xl font-semibold">Password updated</h1>
    <p class="mt-2 text-sm text-gray-600">
      Your password has been successfully changed. You can now log in.
    </p>

    <p class="mt-4">
      <a class="inline-block rounded-md bg-black px-4 py-2 text-sm font-medium text-white hover:bg-gray-800" href="{% url 'accounts:login' %}">
        Go to login
      </a>
    </p>
  </div>
{% endblock %}
