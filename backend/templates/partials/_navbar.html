<nav class="border-b bg-white">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <div class="flex items-center gap-3">
      <a href="/" class="text-sm font-semibold tracking-tight">django-saas-starter</a>

      {% if request.user.is_authenticated and request.tenant %}
        <span class="rounded-full bg-gray-100 px-2 py-1 text-xs text-gray-700">
          {{ request.tenant.name }}
        </span>
      {% endif %}
    </div>

    <div class="flex items-center gap-3">
      {% if request.user.is_authenticated %}
        <span class="hidden text-sm text-gray-600 sm:block">{{ request.user.email }}</span>

        {% if request.tenant %}
          <a class="text-sm font-medium text-gray-700 hover:text-black" href="/tenants/choose/">Switch tenant</a>
        {% endif %}

<!--        <a class="rounded-md border px-3 py-1.5 text-sm font-medium hover:bg-gray-50" href="/accounts/logout/">Logout</a>-->
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button
          type="submit"
          class="rounded-md border px-3 py-1.5 text-sm font-medium hover:bg-gray-50"
        >
          Logout
        </button>
      </form>
      {% else %}
        <a class="rounded-md border px-3 py-1.5 text-sm font-medium hover:bg-gray-50" href="/accounts/login/">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
