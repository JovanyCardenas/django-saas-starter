{% extends "base.html" %}

{% block title %}Organization Settings{% endblock %}

{% block content %}
  <div class="space-y-4">
    <div>
      <h1 class="text-2xl font-semibold">Organization Settings</h1>
      <p class="text-sm text-gray-600">Current tenant information.</p>
    </div>

    <div class="rounded-lg border bg-white p-4">
      <dl class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <dt class="text-xs uppercase tracking-wide text-gray-500">Name</dt>
          <dd class="mt-1 text-sm font-medium">{{ tenant.name }}</dd>
        </div>

        <div>
          <dt class="text-xs uppercase tracking-wide text-gray-500">Slug</dt>
          <dd class="mt-1 text-sm font-medium">{{ tenant.slug }}</dd>
        </div>

        <div>
          <dt class="text-xs uppercase tracking-wide text-gray-500">Active</dt>
          <dd class="mt-1 text-sm font-medium">{{ tenant.is_active }}</dd>
        </div>

        <div>
          <dt class="text-xs uppercase tracking-wide text-gray-500">Created</dt>
          <dd class="mt-1 text-sm font-medium">{{ tenant.created_at }}</dd>
        </div>
      </dl>
    </div>
  </div>
{% endblock %}
